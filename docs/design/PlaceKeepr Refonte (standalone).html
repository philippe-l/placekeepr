document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  @keyframes pkpop { 0% { transform: translateY(8px) scale(.94); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }\n  @keyframes pkfall { 0% { transform: translateY(-30px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(360px) rotate(220deg); opacity: 1; } }\n  @keyframes pkblink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }\n  @keyframes pkpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100%;padding:48px 44px 80px;display:flex;flex-direction:column;gap:56px;\">\n\n  <!-- ===== TITLE ===== -->\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:960px;\">\n    <div style=\"font-family:'Press Start 2P';font-size:26px;line-height:1.5;color:#3a1f2e;\">PLACEKEEPR<\u002Fdiv>\n    <div style=\"font-family:'Press Start 2P';font-size:12px;line-height:1.8;color:#e6541f;\">REFONTE DES ÉCRANS SOCIAUX<\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.7;color:#4a1f33;max-width:760px;\">Architecture d'écrans + moments, dans la DA « Coucher de soleil ». Deux boucles d'engagement : le VISITEUR sur la Carte, le GARDIEN sur son profil, l'ACTIVITÉ qui relie les deux. Chaque cadre porte un badge de référence <span style=\"color:#e6541f;\">(ex. CARTE, CAPTURE·A)<\u002Fspan> — cite-le en chat.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== HANDOFF BANNER ===== -->\n  <div style=\"background:#3a1f2e;border:3px solid #3a1f2e;box-shadow:8px 8px 0 #4a1f33;padding:26px 28px;display:flex;flex-direction:column;gap:22px;\">\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <div style=\"width:14px;height:14px;background:#e6541f;\"><\u002Fdiv>\n      <div style=\"font-family:'Press Start 2P';font-size:13px;color:#fff2e0;\">HANDOFF<\u002Fdiv>\n      <div style=\"font-size:12px;color:#ffe1bf;opacity:.75;\">référence d'implémentation — RN + Expo · pas de WebGL · étendre PixelButton / PixelCard<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- tokens couleur -->\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n      {{ swatches }}\n    <\u002Fdiv>\n\n    <!-- règles -->\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px;background:#4a1f33;border:2px solid #4a1f33;\">\n      <div style=\"background:#fff2e0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:8px;color:#e6541f;\">TYPO<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;\">Press Start 2P → <b>titres &amp; grands nombres seulement<\u002Fb>. Corps + labels → DM Mono (lisible). Jamais de Press Start en paragraphe.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff2e0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:8px;color:#e6541f;\">FORMES<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;\"><b>Aucun border-radius.<\u002Fb> Bordures 2–3 px plum. Ombres dures décalées <code>4px 4px 0 #4a1f33<\u002Fcode> — jamais de flou.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff2e0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:8px;color:#e6541f;\">BOUTON<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;\">Repos = translate(−4,−4) sur la boîte-ombre. Appui = translate(0,0) : il s'enfonce dans son ombre, façon console.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff2e0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:8px;color:#e6541f;\">ESPACEMENT<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;\">Grille 4 px. Gaps 8 / 12 / 16 / 24. Padding carte 16. Cible tactile ≥ 44 px.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff2e0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:8px;color:#e6541f;\">PHOTOS<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;\">Miniature pixel-art : downscale 64 px → posterisation → upscale nearest. <code>image-rendering:pixelated<\u002Fcode>. Carte toujours sombre.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff2e0;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:8px;color:#e6541f;\">LEXIQUE<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.6;\">FR produit : <b>capturer<\u002Fb>, <b>gardien<\u002Fb> (jamais « minter »). EN : <b>mint<\u002Fb>, <b>keeper<\u002Fb>. i18n FR/EN systématique.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== CH.1 ARCHITECTURE ===== -->\n  <div style=\"display:flex;flex-direction:column;gap:20px;\">\n    <div style=\"font-family:'Press Start 2P';font-size:13px;color:#3a1f2e;\">01 · ARCHITECTURE<\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;\">\n      <div style=\"flex:1;min-width:280px;max-width:360px;background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:9px;color:#d11a55;line-height:1.6;\">CE QUI CLOCHE<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.65;\">L'app sait <b>capturer<\u002Fb> mais pas <b>faire revenir<\u002Fb>. La réputation — cœur émotionnel — est invisible. L'onglet Compte est un wallet hérité, vide de sens produit. Le moment « tu deviens gardien » finit dans un Snackbar.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:280px;max-width:360px;background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:9px;color:#e6541f;line-height:1.6;\">PARTI-PRIS<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.65;\">Deux boucles, deux domiciles. Le <b style=\"color:#1f8f80;\">VISITEUR<\u002Fb> vit sur la Carte (découvrir, aimer). Le <b style=\"color:#e6541f;\">GARDIEN<\u002Fb> vit sur son profil (collection, réputation, paliers). L'<b>ACTIVITÉ<\u002Fb> fait le lien et donne la raison de revenir chaque jour.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:280px;max-width:360px;background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:9px;color:#b8730a;line-height:1.6;\">DÉCISION ONGLETS<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.65;\">3 onglets : <b>CARTE · ACTIVITÉ · GARDIEN<\u002Fb>. Compte disparaît → le wallet devient une carte dans Gardien (il faut du SOL pour capturer : ça appartient à l'identité gardien). Réglages passe en engrenage dans l'en-tête Gardien.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- tab bar variants -->\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;margin-top:4px;\">\n      <div id=\"1a\" style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"font-family:'Press Start 2P';font-size:9px;color:#3a1f2e;\">1a<\u002Fdiv><div style=\"font-size:11px;color:#1f8f80;\">RECOMMANDÉ · 3 onglets<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:300px;background:#fff2e0;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;display:flex;\">\n          <div style=\"flex:1;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;background:#fff2e0;border-top:4px solid #e6541f;\">{{ pinCoral }}<div style=\"font-family:'Press Start 2P';font-size:7px;color:#e6541f;\">CARTE<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;border-top:4px solid transparent;\">{{ heartMuted }}<div style=\"font-family:'Press Start 2P';font-size:7px;color:#9c5a4a;\">ACTIVITÉ<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;border-top:4px solid transparent;\">{{ flagMuted }}<div style=\"font-family:'Press Start 2P';font-size:7px;color:#9c5a4a;\">GARDIEN<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:300px;font-size:11.5px;line-height:1.6;color:#4a1f33;\">L'Activité gagne son onglet : c'est le moteur de rétention. Pastille amber sur GARDIEN quand un palier tombe.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"1b\" style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"display:flex;align-items:center;gap:8px;\"><div style=\"font-family:'Press Start 2P';font-size:9px;color:#3a1f2e;\">1b<\u002Fdiv><div style=\"font-size:11px;color:#9c5a4a;\">ALT · 2 onglets + cloche<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:300px;background:#fff2e0;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;display:flex;\">\n          <div style=\"flex:1;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;border-top:4px solid #e6541f;\">{{ pinCoral }}<div style=\"font-family:'Press Start 2P';font-size:7px;color:#e6541f;\">CARTE<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;border-top:4px solid transparent;\">{{ flagMuted }}<div style=\"font-family:'Press Start 2P';font-size:7px;color:#9c5a4a;\">GARDIEN<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:300px;font-size:11.5px;line-height:1.6;color:#4a1f33;\">Plus léger, mais l'activité passe en feuille depuis une cloche sur la Carte → le hook de rétention est enterré. <b>Je recommande 1a.<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== CH.2 CARTE ===== -->\n  <div style=\"display:flex;flex-direction:column;gap:20px;\">\n    <div style=\"font-family:'Press Start 2P';font-size:13px;color:#3a1f2e;\">02 · CARTE — DÉCOUVRIR &amp; CAPTURER<\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start;\">\n\n      <!-- CARTE screen -->\n      <div id=\"carte\" style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:9px;color:#3a1f2e;\">CARTE<\u002Fdiv>\n        <div style=\"width:300px;height:640px;background:#fff2e0;border:3px solid #3a1f2e;box-shadow:6px 6px 0 #4a1f33;display:flex;flex-direction:column;overflow:hidden;flex:none;\">\n          {{ statusBar }}\n          <!-- dark map -->\n          <div style=\"flex:1;position:relative;background:#241826;overflow:hidden;\">\n            <div style=\"position:absolute;inset:0;background-image:linear-gradient(#3a2536 1px,transparent 1px),linear-gradient(90deg,#3a2536 1px,transparent 1px);background-size:34px 34px;opacity:.5;\"><\u002Fdiv>\n            <!-- floating header -->\n            <div style=\"position:absolute;top:12px;left:12px;right:12px;background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:3px 3px 0 #4a1f33;padding:10px 12px;display:flex;flex-direction:column;gap:4px;\">\n              <div style=\"font-family:'Press Start 2P';font-size:9px;color:#3a1f2e;\">MA ZONE · 50 KM<\u002Fdiv>\n              <div style=\"font-size:11px;color:#4a1f33;\">LAT 48.6510  LON −2.0270<\u002Fdiv>\n            <\u002Fdiv>\n            <!-- markers -->\n            <div style=\"position:absolute;top:220px;left:70px;\">{{ pinCoral }}<\u002Fdiv>\n            <div style=\"position:absolute;top:300px;left:150px;\">{{ pinTeal }}<\u002Fdiv>\n            <div style=\"position:absolute;top:180px;left:210px;\">{{ pinTeal }}<\u002Fdiv>\n            <div style=\"position:absolute;top:360px;left:96px;\">{{ pinTeal }}<\u002Fdiv>\n            <div style=\"position:absolute;top:150px;left:120px;\">{{ pinCoral }}<\u002Fdiv>\n            <!-- legend -->\n            <div style=\"position:absolute;bottom:150px;left:12px;background:#3a1f2e;border:2px solid #4a1f33;padding:7px 9px;display:flex;flex-direction:column;gap:5px;\">\n              <div style=\"display:flex;align-items:center;gap:6px;\"><div style=\"width:9px;height:9px;background:#e6541f;\"><\u002Fdiv><div style=\"font-size:10px;color:#fff2e0;\">mes lieux<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:6px;\"><div style=\"width:9px;height:9px;background:#1f8f80;\"><\u002Fdiv><div style=\"font-size:10px;color:#fff2e0;\">autres gardiens<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <!-- capture FAB -->\n            <div style=\"position:absolute;bottom:16px;left:12px;right:12px;background:#4a1f33;\">\n              <div style=\"background:#e6541f;border:3px solid #3a1f2e;transform:translate(-4px,-4px);padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;\">\n                {{ cameraGlyph }}<div style=\"font-family:'Press Start 2P';font-size:11px;color:#fff2e0;\">CAPTURER ICI<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          {{ tabBar }}\n        <\u002Fdiv>\n        <div style=\"width:300px;font-size:11.5px;line-height:1.6;color:#4a1f33;\">Le bouton primaire ne dit plus « mint » : <b>CAPTURER ICI<\u002Fb>. Photo obligatoire + position figée au déclenchement (inchangé). Tap marqueur → fiche ci-contre.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- CARTE with sheet -->\n      <div id=\"carte-fiche\" style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:9px;color:#3a1f2e;\">CARTE · FICHE<\u002Fdiv>\n        <div style=\"width:300px;height:640px;background:#fff2e0;border:3px solid #3a1f2e;box-shadow:6px 6px 0 #4a1f33;display:flex;flex-direction:column;overflow:hidden;flex:none;\">\n          {{ statusBar }}\n dth:760px;\">\n      <div style=\"flex:1;min-width:300px;background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:16px;font-size:12.5px;line-height:1.65;\">La raison de revenir chaque jour : <b>on a aimé mes lieux<\u002Fb> (→ réputation qui monte), captures voisines, paliers franchis. Deux filtres : <b>MOI<\u002Fb> (ce qui touche mes lieux) / <b>AUTOUR<\u002Fb> (ma zone 50 km). Emplacement réservé aux visites.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start;\">\n      <div id=\"activite\" style=\"display:flex;flex-direction:column;gap:10px;\">\n        <div style=\"font-family:'Press Start 2P';font-size:9px;color:#3a1f2e;\">ACTIVITÉ<\u002Fdiv>\n        <div style=\"width:300px;height:640px;background:#fff2e0;border:3px solid #3a1f2e;box-shadow:6px 6px 0 #4a1f33;display:flex;flex-direction:column;overflow:hidden;flex:none;\">\n          {{ statusBar }}\n          <div style=\"padding:14px 14px 10px;border-bottom:3px solid #3a1f2e;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"font-family:'Press Start 2P';font-size:12px;color:#3a1f2e;\">ACTIVITÉ<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;\">\n              <div style=\"background:#e6541f;border:2px solid #3a1f2e;padding:6px 12px;\"><span style=\"font-family:'Press Start 2P';font-size:7px;color:#fff2e0;\">MOI<\u002Fspan><\u002Fdiv>\n              <div style=\"border:2px solid #3a1f2e;padding:6px 12px;\"><span style=\"font-family:'Press Start 2P';font-size:7px;color:#3a1f2e;\">AUTOUR<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;\">{{ feed }}<\u002Fdiv>\n          {{ tabBarActivite }}\n        <\u002Fdiv>\n        <div style=\"width:300px;font-size:11.5px;line-height:1.6;color:#4a1f33;\">Chaque like reçu est une petite récompense visible → boucle gardien. Les captures voisines nourrissent la curiosité → boucle visiteur. Le palier franchi est célébré en amber.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- closing notes -->\n      <div style=\"width:320px;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:16px;display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"font-family:'Press Start 2P';font-size:9px;color:#e6541f;\">CE QUE JE TRANCHE<\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.7;\">✓ Onglets → <a href=\"#1a\">1a<\u002Fa> (3 onglets).<br>✓ Compte hérité → dissous dans <a href=\"#gardien\">GARDIEN<\u002Fa>.<br>✓ Célébration → <a href=\"#4a\">4a<\u002Fa> plein cadre.<br>✓ Réputation → <a href=\"#5a\">5a<\u002Fa> nombre d'abord.<br><span style=\"color:#1f8f80;\">Verrouillé par toi le 08/07.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffe1bf;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:16px;display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"font-family:'Press Start 2P';font-size:9px;color:#b8730a;\">OÙ J'HÉSITE (à toi)<\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.7;\">• Activité onglet vs cloche → <a href=\"#1a\">1a<\u002Fa>/<a href=\"#1b\">1b<\u002Fa>.<br>• Célébration ton fort vs sobre → <a href=\"#4a\">4a<\u002Fa>/<a href=\"#4b\">4b<\u002Fa>.<br>• Réputation nombre vs rang → <a href=\"#5a\">5a<\u002Fa>/<a href=\"#5b\">5b<\u002Fa>.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#3a1f2e;border:3px solid #3a1f2e;box-shadow:4px 4px 0 #4a1f33;padding:16px;display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"font-family:'Press Start 2P';font-size:9px;color:#fff2e0;\">IMPLÉMENTATION<\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.7;color:#ffe1bf;\">PixelCard → variantes accent (borderColor). PixelButton → ajouter variant <code style=\"color:#e6541f;\">teal<\u002Fcode>
