# PlaceKeepr — bloc à déposer dans la conf du nginx PARTAGÉ de la stack
# baladezen (/home/debian/baladezen/infra/nginx/conf.d/), qui détient déjà
# les ports 80/443 et le renouvellement certbot. On s'y greffe plutôt que
# d'empiler un second reverse proxy.
#
# ⚠️ ORDRE DE DÉPLOIEMENT : le conteneur de l'API doit tourner AVANT de
# recharger nginx. `proxy_pass http://placekeepr-api:8787` est résolu au
# chargement de la conf : si l'alias n'existe pas encore, nginx refuse de
# démarrer avec « host not found in upstream » — et emporte baladezen avec lui.
# Toujours : `docker compose up -d` côté placekeepr, PUIS `nginx -t`, PUIS reload.

# ── Rate limit (#41) ────────────────────────────────────────────────────────
# Ce fichier est inclus dans le bloc `http` du nginx PARTAGÉ : les zones et
# `map` ci-dessous sont globales à toute l'instance. D'où le préfixe `pk_` sur
# chaque nom — une collision avec une zone de baladezen ou signal8 ferait
# échouer `nginx -t`, et avec lui le reload de tous les sites.
#
# Clé = IP cliente ($binary_remote_addr) : nginx publie 80/443 directement,
# sans CDN devant, et voit les vraies IP (vérifié le 28/09/2026). Une clé vide
# n'est pas limitée : c'est ce qui permet de ne compter que les POST ci-dessous.
map $request_method $pk_upload_key {
    POST    $binary_remote_addr;
    default "";
}

# Uploads d'assets : une capture = photo + JSON, puis la miniature à la sync,
# avec retries. 10/min en régime, rafale de 20. Le débit seul ne protège pas le
# disque (10/min × 8 Mio reste énorme sur une journée) : la vraie butée est la
# garde d'espace libre de l'API (MIN_FREE_DISK_BYTES, 507).
limit_req_zone $pk_upload_key zone=pk_upload:10m rate=10r/m;
# Routes co-signantes : une capture ou une visite = un appel, plus les retries.
limit_req_zone $binary_remote_addr zone=pk_cosign:10m rate=10r/m;
# Tout le reste. Large : la carte charge d'un coup les miniatures de tous les
# lieux à proximité (GET /assets/*), plusieurs dizaines de requêtes.
limit_req_zone $binary_remote_addr zone=pk_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name placekeepr.app www.placekeepr.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name placekeepr.app www.placekeepr.app;

    ssl_certificate     /etc/letsencrypt/live/placekeepr.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/placekeepr.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Photos de preuve : ~2 Mo aujourd'hui. Le plafond réel est celui de l'API
    # (MAX_ASSET_BYTES, 8 Mio par défaut) — nginx est volontairement au-dessus
    # pour que le refus vienne du serveur, avec un message exploitable.
    client_max_body_size 10M;

    limit_req_status    429;
    limit_req_log_level warn;

    # Les directives proxy_* sont héritées du bloc server par chaque location
    # (aucune ne les redéfinit) : seul le limit_req change de l'une à l'autre.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # POST limités par pk_upload (clé vide pour les GET), lectures par pk_api.
    location /assets/ {
        limit_req zone=pk_upload burst=20 nodelay;
        limit_req zone=pk_api burst=100 nodelay;
        proxy_pass http://placekeepr-api:8787;
    }

    location ~ ^/verify-(capture|visit)$ {
        limit_req zone=pk_cosign burst=10 nodelay;
        proxy_pass http://placekeepr-api:8787;
    }

    # Pas de limite : Helius livre en rafale (lots, rejeux sur non-2xx) depuis
    # quelques IP, et la route est déjà fermée par secret partagé.
    location = /helius-webhook {
        proxy_pass http://placekeepr-api:8787;
    }

    location / {
        limit_req zone=pk_api burst=100 nodelay;
        proxy_pass http://placekeepr-api:8787;
    }
}
